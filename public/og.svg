<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="200" r="260" fill="url(#glow)"/>
  <circle cx="200" cy="500" r="200" fill="url(#glow)" opacity="0.7"/>
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#brand)"/>
    <text x="40" y="58" font-family="Inter, sans-serif" font-size="56" font-weight="700" fill="white" text-anchor="middle">✦</text>
  </g>
  <text x="80" y="370" font-family="Inter, sans-serif" font-size="84" font-weight="800" fill="white">HabitOS</text>
  <text x="80" y="430" font-family="Inter, sans-serif" font-size="36" font-weight="500" fill="url(#brand)">The operating system for your habits.</text>
  <text x="80" y="490" font-family="Inter, sans-serif" font-size="22" fill="#9ca3af">Track anything. See everything. Offline-first.</text>
</svg>
